<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Plus Jakarta Sans',sans-serif; background:#0f172a; color:#f8fafc; padding:20px; font-size:13px; }
    h2 { font-size:18px; margin-bottom:15px; color:#38bdf8; display:flex; align-items:center; gap:8px; }
    .card { background:#1e293b; border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:16px; margin-bottom:14px; }
    label { display:block; color:#94a3b8; font-size:11px; font-weight:700; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.5px; }
    input, select, textarea { width:100%; background:#090e1a; border:1px solid rgba(255,255,255,0.1); color:#fff; padding:8px 10px; border-radius:6px; font-size:12px; margin-bottom:10px; box-sizing:border-box; }
    button { background:#38bdf8; color:#04101e; border:none; padding:8px 16px; border-radius:6px; font-weight:700; cursor:pointer; transition:opacity 0.2s; }
    button:hover { opacity:0.9; }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    .badge { padding:3px 8px; border-radius:12px; font-size:11px; font-weight:700; background:rgba(56,189,248,0.15); color:#38bdf8; }
  </style>
</head>
<body>
  <h2>🤖 GAS AI Proxy Control Center <span class="badge">v3.1 Smart Cooldown</span></h2>
  
  <div class="card">
    <label>Pilih Provider AI</label>
    <select id="pSelect">
      <option value="groq">Groq (Ultra Fast)</option>
      <option value="gemini">Google Gemini</option>
      <option value="mistral">Mistral AI</option>
      <option value="nvidia">Nvidia NIM</option>
      <option value="xkiro">xKiro Gateway</option>
    </select>
    
    <label>Tempel Daftar API Key (1 baris = 1 key)</label>
    <textarea id="kText" rows="6" placeholder="key-pertama-xxx&#10;key-kedua-yyy&#10;key-ketiga-zzz"></textarea>
    
    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:4px;">
      <button id="btnSave" onclick="saveBulk()">🛡️ Validasi & Simpan ke Database</button>
      <span id="saveMsg" style="font-size:12px;"></span>
    </div>
  </div>

  <div class="card" style="font-size:11.5px; color:#94a3b8; line-height:1.6;">
    <strong style="color:#f8fafc;">🧠 Fitur Smart Key Cooldown:</strong><br>
    Jika sebuah kunci terkena <em>429 (Rate Limit / Quota Exceeded)</em>, sistem otomatis mengistirahatkan kunci tersebut selama 60 detik dan langsung melompat ke kunci aktif lainnya tanpa membuat aplikasi menunggu error.
  </div>

  <script>
    function saveBulk() {
      const p = document.getElementById('pSelect').value;
      const text = document.getElementById('kText').value;
      const btn = document.getElementById('btnSave');
      const msg = document.getElementById('saveMsg');
      
      if (!text.trim()) {
        alert("Silakan tempel minimal 1 API key!");
        return;
      }
      
      btn.disabled = true;
      msg.innerHTML = "<span style='color:#38bdf8;'>⏳ Memverifikasi ke server AI...</span>";
      
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          msg.innerHTML = res.ok 
            ? "<span style='color:#34d399;'>✓ " + res.message + "</span>" 
            : "<span style='color:#f87171;'>✕ " + res.error + "</span>";
          if (res.ok) {
            document.getElementById('kText').value = "";
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          msg.innerHTML = "<span style='color:#f87171;'>✕ Error: " + err.message + "</span>";
        })
        .addBulkApiKeysBackend(p, "", text, true, true);
    }
  </script>
</body>
</html>
